<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprachprobe — Schaukasten BroCooked und Browort</title>
    <!--
      Eigene Seite neben der App, nur fuer die Entwicklung (wie
      schaukasten.html der Partykiste und zauberer-schaukasten.html): die
      ECHTEN Bildschirme von BroCooked und Browort mit erfundenen Daten, ohne
      Server und ohne Anmeldung. Daraus entstehen die Vorher-/Nachher-Bilder
      der Uebersetzung (Projekt „BroweGGames Language").

      Aufruf: `npm run dev:client`, dann
      http://localhost:5173/sprachprobe-schaukasten.html?fall=browort-geloest&sprache=en

      Wird beim `vite build` NICHT mitgebaut (die Rollup-Eingabe ist
      index.html), geht also nicht mit ins Betriebspaket.
    -->
    <style>
      body {
        margin: 0;
        background: #0c0812;
        color: #e8eef1;
        font-family: system-ui, sans-serif;
      }
      .sk-seite {
        padding: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 28px 24px;
        align-items: flex-start;
      }
      .sk-kasten {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .sk-kasten figcaption {
        font-size: 13px;
        color: #8fa3ad;
      }
      .sk-kasten figcaption strong {
        color: #e8eef1;
        font-family: ui-monospace, monospace;
      }
      /* Handybreite. Das transform macht den Rahmen zum Bezug fuer „fixed":
         Hub, Spieleinstieg und Vollbild-Blaetter stehen sonst im ganzen
         Fenster uebereinander statt in ihrem Rahmen. */
      .sk-rahmen {
        position: relative;
        width: 390px;
        overflow: hidden;
        transform: translateZ(0);
        border-radius: 22px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      /* Ein einzelner Fall (?fall=…) fuer das Bildschirmfoto: ohne Rand. */
      .sk-einzeln .sk-seite {
        padding: 0;
      }
      .sk-einzeln .sk-kasten figcaption {
        display: none;
      }
      .sk-einzeln .sk-rahmen {
        border-radius: 0;
        box-shadow: none;
      }
      /* Kleine Bausteine (Startkarte, Profil) stehen sonst in einer
         scrollenden Spalte des Hubs; hier eine Spalte mit Luft. */
      .sk-spalte {
        position: absolute;
        inset: 0;
        overflow: auto;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div id="wurzel"></div>
    <script type="module" src="/src/proben/sprache/Schaukasten.tsx"></script>
  </body>
</html>
