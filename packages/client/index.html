<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: Der Inhalt reicht bis unter Notch und Home-Balken,
         die sicheren Raender holt sich das CSS ueber env(safe-area-inset-*).
         user-scalable=no, weil ein Doppeltipper am Spieltisch sonst
         hineinzoomt und die Hand halb aus dem Bild schiebt. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#1a3f7a" />
    <meta
      name="description"
      content="Kartenspiele nach euren Regeln — über alle Spiele hinweg gewertet."
    />

    <!-- Vom Homescreen gestartet laeuft Brauweg ohne Browserleiste. Beide
         Angaben stehen da: die zweite versteht aelteres iOS, die erste ist
         die heutige Schreibweise. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Brauweg" />
    <!-- black-translucent: Die Statusleiste liegt ueber unserer dunklen
         Kopfzeile. Der Platz dafuer kommt aus safe-area-inset-top. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- Startbilder. Ohne sie zeigt iOS beim Oeffnen kurz eine weisse Flaeche;
         jede Zeile gilt fuer genau eine Bildschirmgroesse. -->
    <link
      rel="apple-touch-startup-image"
      href="/start/start-1320x2868.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/start/start-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/start/start-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/start/start-1206x2622.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/start/start-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/start/start-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/start/start-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/start/start-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/start/start-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
    />

    <title>Brauweg</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
