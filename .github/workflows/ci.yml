name: CI

# Bis zum 01.09.2026 hatte dieses Repo keine Prüfstrecke: 983 Tests, die nur
# lief, wenn jemand von Hand daran dachte. Was das kostet, hat dieselbe Nacht
# gezeigt — ein Test war seit Tagen rot, ohne dass es jemand bemerkte, und ein
# Wörterbuch-Eintrag ging doppelt durch, weil niemand baute. Dazu kommt: Die
# Orchestrator-Worker haben im Merge-Auftrag stehen „Prüfungen abwarten, bei
# Grün zusammenführen" — wo es keine Prüfungen gibt, mergen sie sofort.
#
# Aufbau wie in bro-server und brotool, mit einer Besonderheit: Die Workspaces
# müssen VOR den Tests gebaut werden. `npm test` ruft je Paket `tsc && node
# --test dist/...`, und ohne die dist-Ordner der Geschwister findet TypeScript
# `@brauweg/game-api` nicht.

# KONTINGENT-DIAET (20.09.2026). Robin: "die nicht die github actions
# aufbrauchen so massig." Gemessen an der Abrechnung: 3119 Actions-Minuten im
# September, 1119 ueber dem Freikontingent. In diesem Repo liefen seit dem
# 14.09. 31 Laeufe aus Pull Requests UND 29 aus Pushes — fuer weitgehend
# dieselben Commits zweimal.
#
# WARUM `push` NUR NOCH AUF `main`: Nach `staging` kommt nichts, was nicht
# vorher als Pull Request gegen `staging` geprueft wurde — der Push-Lauf danach
# prueft denselben Baum ein zweites Mal. Auf `main` bleibt er: Dort landet der
# Release-Merge, und das ist die Stelle, an der von Hand zusammengefuehrt wird,
# ohne dass je ein PR lief.
on:
  pull_request:
    branches: [main, staging]
    # NUR-DOKU-AENDERUNGEN BAUEN NICHTS (20.09.2026, Kontingent-Diaet).
    #
    # Der volle Lauf dauert hier acht Minuten: zwoelf Spielpakete bauen, dann
    # 1503 Proben. Am 16.09.2026 hat eine Aenderung an CLAUDE.md und
    # docs/STAND.md genau diese acht Minuten gekostet und dabei keine einzige
    # Frage beantwortet, die ein Text aufwerfen koennte.
    #
    # Die Liste ist bewusst kurz und nennt nur, was NICHT gebaut wird. Eine
    # Aenderung, die auch nur eine Datei ausserhalb beruehrt, laeuft
    # vollstaendig — GitHub prueft das je Datei, nicht je PR.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]

# EIN LAUF JE ZWEIG. Wer zweimal hintereinander schiebt, hatte bisher zwei volle
# Laeufe; der erste war in dem Moment schon ueberholt. `cancel-in-progress`
# beendet ihn — dieselbe Einstellung, die bro-server und brotool seit ihrer
# ersten Diaet tragen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Geheimnis-Suche
    runs-on: ubuntu-latest

    # Die Suche zerfällt bewusst in ZWEI Schritte mit sprechenden Namen, weil
    # beide Fälle bis zum 06.09.2026 gleich aussahen: „Die Prüfungen sind nicht
    # durchgegangen". Am 05.09.2026 um 22:04 scheiterte der Merge von PR #93
    # nicht an einem Fund, sondern an `curl: (35) Recv failure` beim Holen von
    # gitleaks. Wer diese Meldung dreimal grundlos liest, sieht beim vierten
    # Mal nicht mehr hin — und dann ist es ein echter Fund. Ab jetzt sagen der
    # Schrittname in der Prüfliste UND die Zusammenfassung des Laufs, welcher
    # der beiden Fälle vorliegt.
    env:
      GITLEAKS_VERSION: 8.18.4
      # Prüfsumme aus gitleaks_8.18.4_checksums.txt der Freigabe. Kein Beiwerk:
      # Ein mitten im Strom abgerissener Download ergibt eine Datei, die erst
      # beim Auspacken stirbt („gzip: stdin: unexpected end of file"). Die
      # Prüfsumme fängt das ab, solange ein neuer Versuch noch etwas nützt.
      GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Nicht die Action, sondern das Programm selbst: gitleaks-action verlangt
      # für Organisationen eine bezahlte Lizenz und bricht ohne sie ab, bevor
      # die erste Datei geprüft ist. Das Programm ist MIT-lizenziert und frei.
      # Genau daher rührt aber auch der Ärger: Wer das Programm selbst holt,
      # holt es über das Netz — und das Netz fällt aus. Deshalb das Folgende.
      #
      # Der Zwischenspeicher ist der eigentliche Gewinn: Bei einem Treffer wird
      # gar nichts geholt, und ein Netzaussetzer kann den Lauf nicht mehr
      # umbringen. Fällt der Zwischenspeicher selbst aus, meldet actions/cache
      # nur eine Warnung und der Schritt darunter lädt wie bisher — eine
      # Zwischenspeicherung, die den Lauf mitreißt, wäre keine Verbesserung.
      - name: Gitleaks aus dem Zwischenspeicher
        id: zwischenspeicher
        uses: actions/cache@v4
        with:
          # Derselbe Ort wie $HOME/.cache/gitleaks im Schritt darunter.
          path: ~/.cache/gitleaks
          key: gitleaks-${{ runner.os }}-x64-${{ env.GITLEAKS_VERSION }}

      # Scheitert DIESER Schritt, ist nichts geprüft und nichts gefunden.
      - name: Gitleaks bereitstellen — ein Fehler hier ist KEIN Fund
        run: |
          set -uo pipefail

          ablage="$HOME/.cache/gitleaks"
          binaer="$ablage/gitleaks"
          echo "$ablage" >> "$GITHUB_PATH"

          scheitern() {
            {
              echo "## ⚠️ Die Geheimnis-Suche ist nicht gelaufen"
              echo
              echo "**Das ist KEIN Fund.** Das Werkzeug ließ sich nicht bereitstellen:"
              echo
              echo "> $1"
              echo
              echo "Am Code ist damit gar nichts geprüft — weder gut noch schlecht."
              echo "Den Lauf wiederholen (Re-run failed jobs)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Gitleaks nicht ladbar (kein Fund)::$1"
            exit 1
          }

          # Ein Treffer im Zwischenspeicher kann trotzdem Bruch sein (halb
          # geschriebener Eintrag). Deshalb wird nicht die Existenz geprüft,
          # sondern ob das Programm läuft; sonst wird neu geladen.
          if [ -x "$binaer" ] && "$binaer" version >/dev/null 2>&1; then
            echo "Aus dem Zwischenspeicher: $("$binaer" version)"
            exit 0
          fi

          rm -rf "$ablage"
          mkdir -p "$ablage"
          roh="$(mktemp -d)/gitleaks.tar.gz"
          quelle="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          # Die alte Fassung war `curl … | sudo tar -xz`. In einer Pipe nützt
          # curls eigener Wiederholungsversuch nichts: tar hat die halbe Datei
          # schon geschluckt, wenn die Verbindung abreißt. Deshalb erst in eine
          # Datei, dann prüfen, dann auspacken — und die Wiederholung umfasst
          # ausdrücklich auch die Prüfsumme.
          geladen=nein
          for versuch in 1 2 3; do
            if curl -sSfL --connect-timeout 10 --max-time 120 \
                 --retry 3 --retry-delay 2 --retry-all-errors \
                 -o "$roh" "$quelle" \
               && echo "${GITLEAKS_SHA256}  ${roh}" | sha256sum -c --status -; then
              geladen=ja
              break
            fi
            echo "Versuch $versuch von 3 fehlgeschlagen (Download oder Prüfsumme)."
            rm -f "$roh"
            sleep $((versuch * 3))
          done
          [ "$geladen" = ja ] || scheitern "Download von $quelle nach drei Versuchen unvollständig oder Prüfsumme falsch."

          tar -xzf "$roh" -C "$ablage" gitleaks || scheitern "Das geladene Archiv ließ sich nicht auspacken."
          chmod +x "$binaer"
          "$binaer" version || scheitern "Das ausgepackte Programm startet nicht."

      # Scheitert DIESER Schritt, hat die Suche etwas gefunden — oder gitleaks
      # selbst ist abgebrochen; die Zusammenfassung unterscheidet beides.
      - name: Geheimnisse suchen — ein Fehler hier IST ein Fund
        run: |
          set -uo pipefail

          # `gitleaks detect` durchsucht die Git-HISTORIE. Steht es vor einem
          # Ordner ohne .git, protokolliert es den Fehler nur und endet mit
          # „no leaks found" und Code 0 (nachgemessen an 8.18.4 am 06.09.2026)
          # — ein grüner Haken, der nichts geprüft hat. Deshalb hier vorher
          # nachsehen, statt sich auf den Exit-Code zu verlassen.
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            {
              echo "## ⚠️ Die Geheimnis-Suche ist nicht gelaufen"
              echo
              echo "**Das ist KEIN Fund.** Im Arbeitsverzeichnis liegt kein Git-Repository;"
              echo "gitleaks hätte hier wortlos „nichts gefunden\" gemeldet."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Kein Git-Repository (kein Fund)::Der Checkout ist unvollständig."
            exit 1
          fi

          # Bei einem Pull Request scannen wir NUR die Commits dieses PR, nicht
          # die ganze Historie. Wer einen Zweig aus einem älteren Commit abzweigt,
          # kriegt sonst alle Funde aus den dazwischenliegenden Commits aufs
          # Dach, auch wenn der PR selbst sauber ist.
          # Bei Push (auf main) bleibt der Scan uneingeschränkt.
          log_opts=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Bereich: von der Verzweigung bis zum PR-Kopf
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            log_opts="--log-opts=${base}..${head}"
          fi

          # --exit-code 2 trennt den Fund vom Werkzeugfehler: Ohne das Flag
          # meldet gitleaks BEIDES als 1 (nachgemessen an 8.18.4 am 06.09.2026:
          # 0 sauber, 1 Fund, 1 auch bei unlesbarer Quelle).
          gitleaks detect --source . --redact --no-banner --verbose \
            --report-path gitleaks-bericht.json --exit-code 2 \
            $log_opts
          code=$?

          if [ "$code" -eq 0 ]; then
            echo "## ✅ Kein Geheimnis gefunden" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$code" -eq 2 ]; then
            {
              echo "## 🔴 Geheimnis gefunden"
              echo
              echo "**Das ist ein echter Fund, kein Netzproblem.** Der Schlüssel gilt als"
              echo "offengelegt: erst zurückziehen und neu ausstellen, dann aus der Historie"
              echo "entfernen. Ein Commit obendrauf genügt nicht."
              echo
              echo "| Datei | Zeile | Regel |"
              echo "| --- | --- | --- |"
              if [ -s gitleaks-bericht.json ]; then
                jq -r '.[] | "| `\(.File)` | \(.StartLine) | \(.RuleID) |"' gitleaks-bericht.json \
                  || echo "| (Bericht nicht lesbar — siehe Protokoll) | | |"
              else
                echo "| (kein Bericht geschrieben — siehe Protokoll) | | |"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## ⚠️ Die Geheimnis-Suche ist abgebrochen"
            echo
            echo "**Das ist KEIN Fund.** gitleaks selbst endete mit Code $code"
            echo "(ein Fund wäre 2). Am Code ist damit nichts geprüft."
            echo "Grund im Protokoll dieses Schritts, dann den Lauf wiederholen."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Gitleaks abgebrochen (kein Fund)::Exit-Code $code"
          exit 1

  rueckfluss:
    name: Rückfluss — main muss Vorfahre von staging sein
    runs-on: ubuntu-latest

    # Am 06.09.2026 stand main drei Commits vor staging, ohne Rückfluss.
    # Aufgefallen ist es erst Tage später, am Release: PR #106 lief in einen
    # Konflikt in Filler.tsx (fünf Stellen) und styles.css. Dieser Job macht
    # aus demselben Zustand eine Meldung binnen Minuten. Er baut nichts und
    # prüft keinen Code — er sieht nur nach, ob die beiden Zweige noch
    # zusammenpassen, und nennt den Rückfluss als Ausweg.
    #
    # Nur bei push, nicht bei pull_request: Der Befund gehört zu den Zweigen,
    # nicht zum Pull Request. Ein Feature-PR, der rot würde, weil main gerade
    # voraus ist, wäre ein Stoppschild an der falschen Stelle — die
    # Merge-Aufträge der Worker urteilen über den Endzustand ALLER Prüfungen
    # und würden jeden Zweig aufhalten, bis jemand den Rückfluss gemacht hat.
    # Die push-Läufe auf main und staging genügen: Jede Bewegung eines der
    # beiden Zweige löst die Prüfung aus.
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          # actions/checkout holt sonst nur den einen Commit (flache
          # Historie). merge-base kennt dann weder main noch staging und
          # meldet „kein Vorfahre", obwohl alles in Ordnung ist.
          fetch-depth: 0

      - name: main muss Vorfahre von staging sein
        run: |
          set -euo pipefail

          scheitern() {
            {
              echo "## ⚠️ Die Rückfluss-Prüfung ist nicht gelaufen"
              echo
              echo "**Das ist KEIN Befund über die Zweige.** Das Werkzeug kam nicht bis zur Prüfung:"
              echo
              echo "> $1"
              echo
              echo "Den Lauf wiederholen (Re-run failed jobs)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Rückfluss-Prüfung nicht gelaufen (kein Befund)::$1"
            exit 1
          }

          # Ausdrücklich beide Zweige frisch holen: Ausgelöst wurde der Lauf
          # von nur einem, geprüft wird aber der Stand des Remotes — nicht
          # der des Checkouts, der bei fetch-depth 0 zwar alles hat, aber
          # vom Zeitpunkt des Auscheckens.
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/staging:refs/remotes/origin/staging \
            || scheitern "git fetch für main und staging ist fehlgeschlagen."

          # Exit-Code 1 heißt „kein Vorfahre"; alles andere ist ein Fehler
          # des Werkzeugs (unbekannter Zweig, kaputter Checkout) und darf
          # nicht wie ein Befund aussehen.
          code=0
          git merge-base --is-ancestor origin/main origin/staging || code=$?
          if [ "$code" -eq 0 ]; then
            echo "## ✅ main ist Vorfahre von staging — kein Rückfluss nötig" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$code" -eq 1 ] || scheitern "git merge-base endete mit Code $code (1 wäre „kein Vorfahre\")."

          anzahl="$(git rev-list --count origin/staging..origin/main)"
          {
            echo "## 🔴 main ist NICHT Vorfahre von staging"
            echo
            echo "main hat $anzahl Commit(s), die staging nicht kennt:"
            echo
            echo '```'
            git log --oneline origin/staging..origin/main
            echo '```'
            echo
            echo "**Rückfluss nötig: main nach staging zurückführen — echter Merge, kein Squash.**"
            echo "Ein Squash legt neue Commits an, main bleibt dann kein Vorfahre, und der"
            echo "nächste Release-PR konfligiert (so geschehen am 06.09.2026, PR #106)."
            echo
            echo '```'
            echo "git fetch origin main staging"
            echo "git checkout -b rueckfluss-main origin/staging"
            echo "git merge --no-ff origin/main"
            echo "# dann Pull Request nach staging — als Merge-Commit zusammenführen"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=main ist nicht Vorfahre von staging::main nach staging zurückführen — echter Merge, kein Squash ($anzahl Commit(s) voraus)."
          exit 1

  build-test:

    # KEINE VOLLE STRECKE FUER EINEN RUECKFLUSS (20.09.2026, Kontingent-Diaet).
    #
    # Ein Rueckfluss-PR bringt `main` zurueck nach `staging`, damit die Zweige
    # nicht auseinanderlaufen. Sein Inhalt ist genau das, was als Release
    # eben ueber `main` gegangen ist — auf dem Weg dorthin schon einmal
    # vollstaendig geprueft. Ihn ein zweites Mal zu bauen kostet drei bis
    # fuenf Minuten und beantwortet keine Frage, die offen waere.
    #
    # Der Zweigname ist die Bedingung, nicht der Titel: Titel tippt man,
    # Zweignamen entstehen aus dem Ablauf (`rueckfluss-main-<zeit>`). Wer
    # trotzdem pruefen will, benennt seinen Zweig anders — dann laeuft alles
    # wie zuvor.
    if: ${{ !startsWith(github.head_ref, 'rueckfluss-') }}
    name: Bauen und prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      # Muss vor den Tests laufen — siehe Kopf dieser Datei.
      - name: Bauen
        run: npm run build

      # `shell: bash` ist hier kein Beiwerk. Nur damit läuft der Schritt mit
      # `-o pipefail`; sonst wäre der Exit-Code der von `tee`, also immer 0,
      # und ein roter Test käme als grüner Haken durch. Das ist die teuerste
      # Art, eine Prüfstrecke kaputtzumachen: Sie sieht weiter aus wie eine.
      - name: Tests
        shell: bash
        run: npm test 2>&1 | tee pruefstand.log

      # Die Zählung stand bis zum 19.09.2026 in `CLAUDE.md` und
      # `docs/STAND.md`, und jede Aufgabe schrieb sie fort. An dem Tag liefen
      # zehn Aufgaben gleichzeitig, und sechs Pull Requests kollidierten — alle
      # in denselben drei Zeilen, keiner im Code. Das war kein Unfall: Jede
      # Zahl gilt nur für den Zweig, in dem sie gemessen wurde.
      #
      # Gemessen wird deshalb weiter, eingetragen nicht mehr. Der Lauf, der
      # ohnehin passiert, schreibt seine Zahlen in die Zusammenfassung — dort
      # gehören sie zu genau einem Commit und niemand muss sie pflegen.
      #
      # `always()`, weil die Aufschlüsselung bei ROTEN Tests am meisten nützt:
      # Dann steht dort, welches Paket. Fehlt das Protokoll, weil der Lauf
      # vorher starb, endet der Schritt still — ein rotes Kreuz an dieser
      # Stelle würde nur vom echten Fehler ablenken.
      - name: Prüfstand in die Zusammenfassung
        if: always()
        shell: bash
        run: |
          [ -f pruefstand.log ] || { echo "Kein Testlauf — nichts zu zählen."; exit 0; }
          # Auch ins Protokoll, nicht nur in die Zusammenfassung: Die
          # Zusammenfassung sieht man nur im Browser, das Protokoll auch von
          # der Kommandozeile (`gh run view --log`) — und wenn die Zählung
          # selbst einmal falsch aussieht, will man sie neben der Ausgabe
          # lesen, aus der sie stammt.
          node werkzeug/pruefstand.mjs pruefstand.log | tee -a "$GITHUB_STEP_SUMMARY"
